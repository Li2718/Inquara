services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inquara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquara}
      POSTGRES_DB: ${POSTGRES_DB:-inquara}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - inquara-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-inquara} -d $${POSTGRES_DB:-inquara}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56380}:6379"
    volumes:
      - inquara-redis:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    restart: unless-stopped

volumes:
  inquara-postgres:
  inquara-redis:
