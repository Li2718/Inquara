services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inquara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquara}
      POSTGRES_DB: ${POSTGRES_DB:-inquara}
    ports:
      - "55432:5432"
    volumes:
      - inquara-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-inquara} -d $${POSTGRES_DB:-inquara}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  inquara-postgres:
